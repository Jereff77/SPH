version: '3.8'

services:
  # Sistema completo con Frontend, API y Procesador
  sph-facturas-fullstack:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    container_name: sph-facturas-fullstack
    restart: unless-stopped

    # Límites de recursos para EasyPanel
    deploy:
      resources:
        limits:
          cpus: '2.0'          # Aumentado para API + Frontend
          memory: 1G           # Aumentado para ambos servicios
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check mejorado
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s       # Aumentado para permitir build del frontend

    # Puertos expuestos
    ports:
      - "8000:8000"   # API FastAPI (opcional, para acceso directo)
      - "8080:80"     # Frontend (nginx) - Puerto principal para dashboard

    environment:
      # Variables de entorno - Configurar en Easy Panel
      # Configuración IMAP
      - IMAP_SERVER=${IMAP_SERVER:-imap.hostinger.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}

      # Configuración Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - TABLE_NAME=${TABLE_NAME:-catFacturas}

      # Configuración del procesador
      - POLLING_INTERVAL=${POLLING_INTERVAL:-60}
      - POLLING_INTERVAL_IDLE=${POLLING_INTERVAL_IDLE:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Configuración de la API
      - API_PORT=${API_PORT:-8000}

      # Configuración de horarios
      - SCHEDULE_ENABLED=${SCHEDULE_ENABLED:-true}
      - SCHEDULE_START_TIME=${SCHEDULE_START_TIME:-06:00}
      - SCHEDULE_END_TIME=${SCHEDULE_END_TIME:-23:00}
      - SCHEDULE_DAYS=${SCHEDULE_DAYS:-1,2,3,4,5,7}
      - SCHEDULE_TIMEZONE=${SCHEDULE_TIMEZONE:-America/Mexico_City}

      # Auto-iniciar procesador
      - AUTO_START_PROCESSOR=${AUTO_START_PROCESSOR:-true}

    volumes:
      # Montar volumen persistente para logs
      - sph-logs:/app/logs
      # Montar volumen para sesiones/contexto
      - sph-sessions:/app/.sessions

    networks:
      - sph-network

    # Labels para EasyPanel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sph-facturas.rule=Host(`facturas.sph.com`)"  # Cambiar por tu dominio
      - "traefik.http.routers.sph-facturas.entrypoints=websecure"
      - "traefik.http.services.sph-facturas.loadbalancer.server.port=80"
      - "app.sph-facturas=true"
      - "com.easypanel.type=fullstack"
      - "com.easypanel.name=Sistema de Facturas"
      - "com.easypanel.icon=https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
      - "com.easypanel.description=Sistema de procesamiento de facturas con dashboard web"

volumes:
  # Volúmenes con etiquetas descriptivas
  sph-logs:
    driver: local
    labels:
      - "app=sph-facturas"
      - "type=logs"

  sph-sessions:
    driver: local
    labels:
      - "app=sph-facturas"
      - "type=sessions"

networks:
  sph-network:
    driver: bridge
    labels:
      - "app=sph-facturas"
