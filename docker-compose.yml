# Orquestación de referencia (uso local o como Compose en EasyPanel).
# En EasyPanel lo habitual es crear 2 "Apps" separadas (api y web) apuntando a
# los Dockerfiles; este compose documenta los puertos, env y build args.
#
# Uso local:  docker compose up --build   (define antes las variables en un .env)

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DOMINIOS_AUTORIZADOS: ${DOMINIOS_AUTORIZADOS:-aceleremos.com,gruposph.mx}
      BANXICO_TOKEN: ${BANXICO_TOKEN}
    ports:
      - "3001:3001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL pública del backend (se hornea en el bundle en build time).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
