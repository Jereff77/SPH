<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Prospecto - Grupo SPH</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #21273C 0%, #2c3654 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #21273C;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .asesor-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #21273C;
        }

        .asesor-info p {
            margin: 0;
            color: #333;
            font-size: 14px;
        }

        .asesor-info strong {
            color: #21273C;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #21273C;
            box-shadow: 0 0 0 3px rgba(33, 39, 60, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #21273C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #2c3654;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 39, 60, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #21273C;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.active {
            display: block;
        }

        .alert-error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .alert-success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .error-page {
            text-align: center;
            padding: 40px 20px;
        }

        .error-page h2 {
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .error-page p {
            color: #666;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Grupo SPH</h1>
            <p>Registro de Prospecto</p>
            <p><strong>Registro en revisión, favor de esperar aprobación de parte de tu Responsable Comercial</Strong></p>
        </div>

        <div id="loadingValidacion" class="loading active">
            <div class="spinner"></div>
            <p>Validando asesor...</p>
        </div>

        <div id="errorAsesor" style="display: none;" class="error-page">
            <h2>⚠️ Acceso No Autorizado</h2>
            <p>El código de asesor no es válido o está inactivo.</p>
            <p>Serás redirigido en <span id="countdown">5</span> segundos...</p>
        </div>

        <div id="formularioContainer" style="display: none;">
            <div id="asesorInfo" class="asesor-info">
                <p><strong>Asesor:</strong> <span id="nombreAsesor">-</span></p>
            </div>

            <div id="alertContainer"></div>

            <form id="leadForm">
                <div class="form-group">
                    <label for="nombreLead">Nombre del Prospecto<span class="required">*</span></label>
                    <input type="text" id="nombreLead" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono<span class="required">*</span></label>
                    <input type="tel" id="telefono" required placeholder="Ej: 5551234567">
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="Ej: ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="tipoOperacion">Tipo de Operación<span class="required">*</span></label>
                    <select id="tipoOperacion" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipoVenta">Tipo de Venta<span class="required">*</span></label>
                    <select id="tipoVenta" required>
                        <option value="">Seleccione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="superficie">¿Qué superficie requiere tu cliente?</label>
                    <input type="text" id="superficie" placeholder="Ej: 500 m²">
                </div>

                <div class="form-group">
                    <label for="kvAs">¿Requiere KVA's?</label>
                    <select id="kvAs" required>
                        <option value="">Seleccione...</option>
                        <option value="Si">Si</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ubicacion">¿Cuál es la mejor ubicación para tu cliente?</label>
                    <select id="ubicacion" required>
                        <option value="">Seleccione...</option>
                        <option value="Spartek I, II, III - Zona El Marqués - salida a CDMX">Spartek I, II, III - Zona El Marqués - salida a CDMX</option>
                        <option value="Acupark I - Zona El Marqués - salida Aeropuerto (sólo renta)">Acupark I - Zona El Marqués - salida Aeropuerto (sólo renta)</option>
                        <option value="Omegapark, Sitapark, Actitek - Zona Parque Industrial Bernardo Quintana (sólo renta)">Omegapark, Sitapark, Actitek - Zona Parque Industrial Bernardo Quintana (sólo renta)</option>
                        <option value="ACUPARK II y III - Zona Santa Rosa Jauregui - salida a SLP">ACUPARK II y III - Zona Santa Rosa Jauregui - salida a SLP</option>
                        <option value="SPH Norponiente (preventa) - Zona Tlacote - salida a Celaya">SPH Norponiente (preventa) - Zona Tlacote - salida a Celaya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje Adicional</label>
                    <textarea id="mensaje" placeholder="Información adicional sobre el prospecto..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    Registrar Prospecto
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const SUPABASE_CONFIG = {
            url: 'https://szjlkvakwljssdnysazp.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6amxrdmFrd2xqc3NkbnlzYXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTY4MTkxOTEsImV4cCI6MjAxMjM5NTE5MX0.OvICpRi2IHrrzwQ6TDl_031QRU6qTy2gRWylMrGU8y8'
        };

        const supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

        // Variable global para almacenar datos del asesor
        let datosAsesor = null;

        // Función para sanitizar inputs (protección XSS)
        function sanitizarInput(valor) {
            if (!valor) return '';
            const div = document.createElement('div');
            div.textContent = valor;
            return div.innerHTML;
        }

        // Función para mostrar alertas
        function mostrarAlerta(mensaje, tipo = 'error') {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${tipo} active">
                    ${sanitizarInput(mensaje)}
                </div>
            `;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // Función para validar y cargar asesor
        async function validarYCargarAsesor() {
            try {
                // Obtener parámetro 'a' de la URL
                const urlParams = new URLSearchParams(window.location.search);
                const codigoAsesor = urlParams.get('a');

                console.log('🔍 Código de asesor recibido:', codigoAsesor);

                if (!codigoAsesor) {
                    console.error('❌ No se proporcionó código de asesor');
                    mostrarErrorYRedirigir();
                    return;
                }

                // Llamar a la función de Supabase para obtener datos del asesor
                const { data, error } = await supabaseClient
                    .rpc('catasesoresinm_obtener_por_codigo', { p_codigo: codigoAsesor });

                console.log('📡 Respuesta de Supabase:', { data, error });

                if (error) {
                    console.error('❌ Error al consultar asesor:', error);
                    mostrarErrorYRedirigir();
                    return;
                }

                // Verificar que existan datos
                if (!data || data.length === 0) {
                    console.error('❌ Asesor no encontrado');
                    mostrarErrorYRedirigir();
                    return;
                }

                const asesor = data[0];
                console.log('👤 Datos del asesor recibidos:', asesor);
                console.log('🔑 uidr del asesor:', asesor.uidr);

                // Verificar que el asesor esté activo
                if (!asesor.status) {
                    console.error('❌ Asesor inactivo');
                    mostrarErrorYRedirigir();
                    return;
                }

                // CRÍTICO: Verificar que uidr no sea null o undefined
                if (!asesor.uidr) {
                    console.warn('⚠️ ADVERTENCIA: uidr es null o undefined');
                }

                // Guardar datos del asesor
                datosAsesor = {
                    uuid: asesor.uuid,
                    status: asesor.status,
                    idInmobiliaria: asesor.idInmobiliaria,
                    nombre: asesor.nombre,
                    uidr: asesor.uidr
                };

                console.log('✅ Datos del asesor guardados en variable global:', datosAsesor);

                // Mostrar nombre del asesor en la página
                document.getElementById('nombreAsesor').textContent = asesor.nombre;

                // Ocultar loading y mostrar formulario
                document.getElementById('loadingValidacion').classList.remove('active');
                document.getElementById('formularioContainer').style.display = 'block';

                console.log('✅ Asesor validado correctamente');

                // Cargar opciones de los dropdowns
                await cargarTiposOperacion();
                await cargarTiposVenta();

            } catch (error) {
                console.error('❌ Error inesperado:', error);
                mostrarErrorYRedirigir();
            }
        }

        // Función para mostrar error y redirigir
        function mostrarErrorYRedirigir() {
            document.getElementById('loadingValidacion').classList.remove('active');
            document.getElementById('errorAsesor').style.display = 'block';

            let segundos = 5;
            const countdownElement = document.getElementById('countdown');

            const interval = setInterval(() => {
                segundos--;
                countdownElement.textContent = segundos;

                if (segundos <= 0) {
                    clearInterval(interval);
                    window.location.href = 'https://gruposph.mx';
                }
            }, 1000);
        }

        // Cargar tipos de operación
        async function cargarTiposOperacion() {
            try {
                const { data, error } = await supabaseClient.rpc('crm_tipooperaciones_obtener_activos');
                
                if (error) throw error;

                console.log('📋 Tipos de operación recibidos:', data);

                const select = document.getElementById('tipoOperacion');
                
                if (!data || data.length === 0) {
                    console.warn('⚠️ No se recibieron tipos de operación');
                    return;
                }

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.titulo; // CORREGIDO: era 'nombre', debe ser 'titulo'
                    select.appendChild(option);
                });

                console.log('✅ Tipos de operación cargados:', data.length);
            } catch (error) {
                console.error('❌ Error al cargar tipos de operación:', error);
                mostrarAlerta('Error al cargar tipos de operación');
            }
        }

        // Cargar tipos de venta
        async function cargarTiposVenta() {
            try {
                const { data, error } = await supabaseClient.rpc('crm_tipoventa_obtener_activos');
                
                if (error) throw error;

                console.log('📋 Tipos de venta recibidos:', data);

                const select = document.getElementById('tipoVenta');
                
                if (!data || data.length === 0) {
                    console.warn('⚠️ No se recibieron tipos de venta');
                    return;
                }

                data.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.titulo; // CORREGIDO: era 'nombre', debe ser 'titulo'
                    select.appendChild(option);
                });

                console.log('✅ Tipos de venta cargados:', data.length);
            } catch (error) {
                console.error('❌ Error al cargar tipos de venta:', error);
                mostrarAlerta('Error al cargar tipos de venta');
            }
        }

        // Enviar formulario
        async function enviarFormulario(event) {
            event.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Registrando...';

            try {
                // Verificar que datosAsesor exista
                if (!datosAsesor) {
                    throw new Error('No se han cargado los datos del asesor');
                }

                console.log('📋 Verificando datos del asesor antes de enviar:');
                console.log('  - datosAsesor completo:', datosAsesor);
                console.log('  - uidr:', datosAsesor.uidr);
                console.log('  - uuid:', datosAsesor.uuid);
                console.log('  - idInmobiliaria:', datosAsesor.idInmobiliaria);

                // Obtener y sanitizar valores del formulario
                const nombreLead = sanitizarInput(document.getElementById('nombreLead').value.trim());
                const telefono = sanitizarInput(document.getElementById('telefono').value.trim());
                const correo = sanitizarInput(document.getElementById('correo').value.trim());
                const tipoOperacion = parseInt(document.getElementById('tipoOperacion').value);
                const tipoVenta = parseInt(document.getElementById('tipoVenta').value);
                const mensaje = sanitizarInput(document.getElementById('mensaje').value.trim());
                const superficie = sanitizarInput(document.getElementById('superficie').value.trim());
                const kvAs = sanitizarInput(document.getElementById('kvAs').value);
                const ubicacion = sanitizarInput(document.getElementById('ubicacion').value);

                // VERIFICACIÓN CRÍTICA: Revisar que uidr NO sea null
                console.log('🔍 VERIFICACIÓN CRÍTICA antes de enviar:');
                console.log('  - datosAsesor.uidr:', datosAsesor.uidr);
                console.log('  - Tipo de datosAsesor.uidr:', typeof datosAsesor.uidr);
                console.log('  - ¿Es null?:', datosAsesor.uidr === null);
                console.log('  - ¿Es undefined?:', datosAsesor.uidr === undefined);

                // Preparar parámetros para el RPC
                const parametros = {
                    p_nombre_lead: nombreLead,
                    p_telefono: telefono,
                    p_correo: correo || null,
                    p_id_tipo_operacion: tipoOperacion,
                    p_id_tipo_venta: tipoVenta,
                    p_id_inmobiliaria: datosAsesor.idInmobiliaria,
                    p_id_asesor_inm: datosAsesor.uuid,
                    p_uid_rc: datosAsesor.uidr,
                    p_mensaje: mensaje || null,
                    p_superficie: superficie || null,
                    p_kvas: kvAs || null,
                    p_ubicacion: ubicacion || 'Indistinto',
                    p_persona_fisica: true  // Valor por defecto para persona física
                };

                console.log('📤 Parámetros que se enviarán a la función:');
                console.log(JSON.stringify(parametros, null, 2));
                console.log('📤 Específicamente p_uid_rc:', parametros.p_uid_rc);

                // Llamar a la función de inserción
                const { data, error } = await supabaseClient.rpc('leads_poraprobar_insertar_registro', parametros);

                if (error) {
                    console.error('❌ Error de Supabase:', error);
                    throw error;
                }

                console.log('✅ Respuesta del servidor:', data);

                if (data.exito) {
                    console.log('🎉 Lead registrado con ID:', data.detalles.id_registro);
                    
                    // VERIFICAR EN LA BD QUE SE GUARDÓ EL uidr
                    console.log('🔍 Ahora deberías verificar en la BD que el registro con ID', data.detalles.id_registro, 'tenga el campo uidRC guardado');
                    
                    mostrarAlerta('✅ Prospecto registrado exitosamente', 'success');
                    document.getElementById('leadForm').reset();
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    mostrarAlerta(`Error: ${data.mensaje}`, 'error');
                }

            } catch (error) {
                console.error('❌ Error al registrar:', error);
                mostrarAlerta('Error al registrar el prospecto. Intente nuevamente.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Registrar Prospecto';
            }
        }

        // Event listeners
        document.getElementById('leadForm').addEventListener('submit', enviarFormulario);

        // Iniciar validación al cargar la página
        validarYCargarAsesor();
    </script>
</body>
</html>
